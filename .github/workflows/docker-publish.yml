# Build the Stream Monitor image and publish it to GitHub Container Registry.
#
# No secrets are required: the job authenticates to ghcr.io with the built-in
# GITHUB_TOKEN (granted packages: write below). After the first push, set the
# package visibility to Public under the repository's Packages page so users
# can pull without logging in.
#
# Resulting image: ghcr.io/<repository-owner>/stream-monitor
#   push to main            -> :latest and :sha-<short> (multi-arch)
#   push to dev             -> :dev and :sha-<short> (multi-arch, preview)
#   push tag v1.2.0         -> :1.2.0 and :sha-<short> (multi-arch)
#   push tag v1.0           -> :1.0 and :sha-<short> (multi-arch)
#   pull request            -> build only (amd64), no push, no credentials
#
# The :dev tag is a moving preview built from the dev branch. It is never
# tagged :latest; only the default branch (main) publishes :latest.
#
# The image is built for linux/amd64 (Ubuntu servers) and linux/arm64
# (Apple Silicon / ARM hosts). The Dockerfile already handles both through
# TARGETARCH and its Deno download.

name: Build and publish Docker image

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# One run per ref; a newer push cancels an older in-flight build.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Image name under the repository owner (not the full image path).
  IMAGE_NAME: stream-monitor

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q

  build:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Resolve the image name once and lowercase it (registries require
      # lowercase repository names).
      - name: Resolve image name
        id: image
        run: |
          set -eu
          image="$(printf '%s/%s/%s' "$REGISTRY" "$GITHUB_REPOSITORY_OWNER" "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image will be: $image"

      # QEMU is only needed for the arm64 half of the multi-platform build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=match,pattern=v(.*),group=1
            type=sha,format=short
          # Override GitHub's detected license, which cannot tell "only" apart.
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Pull requests are single-architecture so feedback stays fast (they
          # are never pushed); dev, main and tags produce the full multi-arch
          # image. (arm64 is emulated through QEMU and dominates build time.)
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Skip the provenance attestation manifests, which GHCR lists as
          # "unknown/unknown" platforms alongside the real images.
          provenance: false
          # Optional build-time pins; set these as repository variables to
          # override the Dockerfile defaults.
          build-args: |
            DENO_VERSION=${{ vars.DENO_VERSION || '2.9.8' }}
            YTDLP_VERSION=${{ vars.YTDLP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
