# Build the Stream Monitor image and publish it to Docker Hub.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions ->
# Secrets tab, NOT the Variables tab):
#   DOCKERHUB_USERNAME  Docker Hub account name (lowercase)
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope
#
# Resulting image: <dockerhub-username>/stream-monitor
#   push to main            -> :latest and :sha-<short>
#   push tag v1.2.0         -> :1.2.0 and :sha-<short>
#   push tag v1-Beta1       -> :1-Beta1 and :sha-<short>
#   pull request            -> build only (amd64), no push, no credentials
#
# The image is built for linux/amd64 (Ubuntu servers) and linux/arm64
# (Apple Silicon / ARM hosts). The Dockerfile already handles both through
# TARGETARCH and its Deno download.

name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref; a newer push cancels an older in-flight build.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Docker Hub repository name (not the full image path).
  DOCKERHUB_REPOSITORY: stream-monitor

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -q

  build:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Resolve the image name once, lowercase it (Docker requires lowercase
      # repository names), and fail early with a readable message when the
      # Docker Hub credentials are missing.
      - name: Resolve image name
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          username="${DOCKERHUB_USERNAME:-}"
          token="${DOCKERHUB_TOKEN:-}"

          if [ -z "$username" ] || [ -z "$token" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "No Docker Hub credentials for this pull request; building without pushing."
              username="local"
            else
              echo "::error::Docker Hub credentials are missing. Add repository secrets DOCKERHUB_USERNAME (your lowercase Docker Hub username) and DOCKERHUB_TOKEN (an access token with Read & Write scope). The token must be a Secret, not a Variable."
              exit 1
            fi
          fi

          image="$(printf '%s/%s' "$username" "$DOCKERHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image will be: $image"

      # QEMU is only needed for the arm64 half of the multi-platform build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Pull requests are single-architecture to keep them fast; main and
          # tags produce the full multi-arch image.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optional build-time pins; set these as repository variables to
          # override the Dockerfile defaults.
          build-args: |
            DENO_VERSION=${{ vars.DENO_VERSION || '2.9.8' }}
            YTDLP_VERSION=${{ vars.YTDLP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
