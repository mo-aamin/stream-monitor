{% extends "base.html" %}

{% block title %}{{ code }} · {{ app_name }}{% endblock %}

{% block content %}
<section class="panel error-panel">
  <p class="error-code">{{ code }}</p>
  <h2>{{ message }}</h2>
  <p class="muted">If this keeps happening, check the application log under Activity &amp; Logs.</p>
  <div class="inline-actions">
    <a class="btn primary" href="/">Back to dashboard</a>
    <a class="btn ghost" href="/logs">Open logs</a>
  </div>
</section>
{% endblock %}
